<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>وضع عدم الاتصال | مصنع الجودة</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Cairo', Tahoma, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        .card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 1.25rem;
            max-width: 500px;
            width: 100%;
            padding: 2rem;
            text-align: center;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }
        .icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }
        h1 {
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
            color: #f8fafc;
        }
        p {
            font-size: 0.875rem;
            color: #94a3b8;
            line-height: 1.6;
            margin-bottom: 1.5rem;
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.875rem 1.25rem;
            border-radius: 0.75rem;
            font-size: 0.875rem;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.2s;
            cursor: pointer;
            border: none;
        }
        .btn-primary {
            background-color: #2563eb;
            color: white;
        }
        .btn-primary:hover {
            background-color: #1d4ed8;
        }
        .btn-secondary {
            background-color: #334155;
            color: #cbd5e1;
        }
        .btn-secondary:hover {
            background-color: #475569;
        }
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            background-color: #451a03;
            color: #fde68a;
            border: 1px solid #78350f;
            padding: 0.35rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 700;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="status-badge">
            ⚡ وضع عدم الاتصال بالإنترنت (Offline Mode)
        </div>
        <div class="icon">📶❌</div>
        <h1>لا يوجد اتصال بالإنترنت حالياً</h1>
        <p>
            لا تقلق! نظام الجودة مزود بنظام بيع محلي يعمل 100% بدون إنترنت.
            يمكنك إصدار الفواتير وطباعة الإيصالات فورياً، وسيتم رفعها ومزامنتها تلقائياً مع الخادم فور عودة الاتصال.
        </p>

        <div class="btn-group">
            <a href="/sales/new" class="btn btn-primary">
                🛒 فتح نقطة البيع وإصدار الفواتير
            </a>
            <a href="/warehouse" class="btn btn-secondary">
                📦 إدارة المخزن
            </a>
            <button onclick="window.location.reload()" class="btn btn-secondary">
                🔄 إعادة محاولة الاتصال بالشبكة
            </button>
        </div>
    </div>
</body>
</html>
